<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="description" content="BudgetBuddy searches the web and answers your shopping questions."/>
<meta name="theme-color" content="#36b9ea"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<title>BudgetBuddy — shopping assistant</title><link rel="stylesheet" href="style.css"/></head>
<body><div class="sky-decoration" aria-hidden="true"><span class="sky-cloud">☁</span><span class="sky-star">✦</span><span class="sky-heart">♡</span></div><div class="app">
<aside class="navigation" id="navigation" aria-label="App navigation"></aside>
<main class="main">
<header class="topbar"><div class="page-heading"><h1 class="page-title" id="page-title">BudgetBuddy assistant</h1><p class="page-sub" id="page-sub">Your friendly helper for products, prices, lists and deals.</p></div>
<div class="top-actions"><form class="top-search" id="top-search" role="search"><span aria-hidden="true">⌕</span><label class="sr-only" for="top-query">Search products</label><input type="search" id="top-query" placeholder="Search for products..." maxlength="90"/><button class="sr-only" type="submit">Search</button></form><button class="header-cart" type="button" data-action="page" data-id="cart" aria-label="Open shopping list"><svg class="header-cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l1.5 13h-17L5 8Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg><span class="header-cart-count" id="cart-count">0</span></button></div></header>
<div id="extension-setup" class="extension-setup" role="alert" hidden></div>
<section class="hero"><div class="hero-copy"><span class="hero-overline">🎁 BUDGETBUDDY DEALS</span><h2>Shop smarter, save sweeter!</h2><p>Compare prices, collect promo codes and plan your shop — all in one happy place.</p></div><div class="hero-shape" id="hero-shape" aria-hidden="true">🎁</div></section>
<div class="workspace" id="workspace"><div id="promos" class="promo-column"></div><div id="center" class="center-column" aria-live="polite"></div><div id="right" class="right-column"></div></div>
</main></div><div id="cart-modal-root"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js" defer></script></body></html>
