<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Shopwise extension settings</title>
  <link rel="stylesheet" href="options.css"/>
</head>
<body>
  <main class="settings">
    <div class="brand"><span class="brand-icon" aria-hidden="true">✦</span><span>Shopwise</span></div>
    <h1>Connect your Shopwise server</h1>
    <p class="intro">Enter the HTTPS address of your deployed Shopwise website. The extension uses its existing API; your AI provider key stays on the server.</p>
    <form id="settings-form">
      <label for="api-url">Shopwise website URL</label>
      <input id="api-url" type="url" placeholder="https://your-shopwise-site.example" autocomplete="url" required/>
      <p class="hint">Use the website origin only, without a path. For local development, http://localhost:3000 is allowed.</p>
      <button type="submit">Save and connect</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
